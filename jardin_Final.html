<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuestro Jardín">
<title>Nuestro Jardín</title>
<style>
  :root{
    --cielo-1:#FFE8C2; --cielo-2:#FFB199;
    --pasto-1:#3F6B33; --pasto-2:#4F7942;
    --tierra:#6B4423; --tierra-clara:#8B5E34;
    --hoja:#4F7942; --hoja-clara:#7FAA65;
    --acento:#D1495B; --acento-2:#F2C14E;
    --tinta:#3B2A1A; --crema:#FFF8EC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:manipulation;}
  body{
    font-family:-apple-system, "Avenir Next", "Helvetica Neue", sans-serif;
    background:linear-gradient(180deg,var(--cielo-1) 0%, var(--cielo-2) 100%);
    color:var(--tinta);
    display:flex; flex-direction:column;
    height:100vh;
    height:-webkit-fill-available;
    height:100dvh;
    width:100vw;
    position:fixed; inset:0;
    transition:background 1.2s ease, color 1.2s ease;
  }

  /* ===== Temporadas ===== */
  body.primavera{ --cielo-1:#FFE8C2; --cielo-2:#FFB199; --pasto-1:#3F6B33; --pasto-2:#4F7942; }
  body.verano{    --cielo-1:#BFEAFF; --cielo-2:#FFE5A8; --pasto-1:#2F7A2E; --pasto-2:#3F9A3C; }
  body.otono{     --cielo-1:#FFD6A0; --cielo-2:#E8916B; --pasto-1:#7A6A2E; --pasto-2:#9C8438; }
  body.invierno{  --cielo-1:#DCE9F2; --cielo-2:#AFC4D6; --pasto-1:#7C8B7E; --pasto-2:#9CAA9C; }

  /* ===== Cielo según clima real detectado (pisa la temporada cuando hay permiso de ubicación) ===== */
  body.clima-despejado{ --cielo-1:#8FCBF2; --cielo-2:#3E8FD0; }
  body.clima-nublado{   --cielo-1:#B7C4CE; --cielo-2:#8A99A6; }
  body.clima-niebla{    --cielo-1:#D7DEE2; --cielo-2:#B9C2C8; }
  body.clima-lluvia{    --cielo-1:#7C8C9E; --cielo-2:#4E5E70; }
  body.clima-nieve{     --cielo-1:#E4EEF5; --cielo-2:#C3D5E3; }
  body.clima-tormenta{  --cielo-1:#5B6470; --cielo-2:#33394A; }

  /* ===== Sin permiso de ubicación: cielo azul fijo de día, paleta de noche elegida ===== */
  body.clima-sin-permiso{ --cielo-1:#9AD0F5; --cielo-2:#4FA0DE; }
  body.clima-sin-permiso.noche{ --cielo-noche-1:#0B1A33; --cielo-noche-2:#173256; }

  /* ===== Modo noche ===== */
  body.noche{
    background:linear-gradient(180deg,var(--cielo-noche-1,#0B1437) 0%, var(--cielo-noche-2,#1B2A52) 100%);
    color:#EDEAF6;
  }
  body.noche .titulo{ color:#F4F1FF; }
  body.noche .contador{ color:#CFC9EA; }
  body.noche .vacio{ color:#CFC9EA; }
  body.noche .panel{ background:#1E1A33; border-top-color:rgba(237,234,246,0.15); }
  body.noche .panel-label{ color:#B9AFE0; }
  body.noche input#codigo{ background:#2A2547; border-color:#5B4E94; color:#F4F1FF; }
  body.noche .pasto-sup{ fill:#1F3320; }
  body.noche .pasto-inf{ fill:#27412A; }
  body.noche .sol{ display:none; }
  body.noche .luna{ display:block; }
  body.noche .reset{ color:#EDEAF6; }
  body.noche .nube{ opacity:0.12; }

  .pasto-sup{ fill:var(--pasto-1); transition:fill 1.2s ease; }
  .pasto-inf{ fill:var(--pasto-2); transition:fill 1.2s ease; }

  /* Sol / Luna */
  .sol{
    position:absolute; top:6%; right:12%; width:70px; height:70px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #FFF6DC, var(--acento-2));
    box-shadow:0 0 40px 10px rgba(242,193,78,0.55); z-index:1;
  }
  .luna{
    display:none;
    position:absolute; top:6%; right:12%; width:56px; height:56px; border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #FFFFFF, #D9D6F2 70%);
    box-shadow:0 0 30px 8px rgba(217,214,242,0.45); z-index:1;
  }
  .estrella{
    position:absolute; width:3px; height:3px; background:#fff; border-radius:50%;
    opacity:0; transition:opacity 1.2s ease; z-index:1;
  }
  body.noche .estrella{ opacity:0.85; animation:titilar 3s ease-in-out infinite; }
  @keyframes titilar{ 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  .fugaz{
    position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    box-shadow:0 0 6px 2px #fff; z-index:1;
    animation:cruzar 1.1s linear forwards;
  }
  .fugaz::after{
    content:""; position:absolute; top:1px; right:0; width:60px; height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,0.9), transparent);
  }
  @keyframes cruzar{
    from{ transform:translate(0,0); opacity:1; }
    to{ transform:translate(-180px,120px); opacity:0; }
  }

  /* Nubes */
  .nube{
    position:absolute; opacity:0.85; z-index:1; transition:opacity 1.2s ease;
    animation:flotar linear infinite;
  }
  .nube svg{ display:block; width:100%; height:100%; }
  @keyframes flotar{
    from{ transform:translateX(-10vw); }
    to{ transform:translateX(110vw); }
  }

  /* Nieve / hojas de otoño */
  .particula{
    position:absolute; top:-5%; border-radius:50%; z-index:1; pointer-events:none;
    animation:caer linear infinite;
  }
  @keyframes caer{
    from{ transform:translateY(0) translateX(0) rotate(0deg); opacity:1; }
    to{ transform:translateY(115vh) translateX(20px) rotate(180deg); opacity:0.4; }
  }

  /* Mariposas / abejas */
  .bicho{
    position:absolute; z-index:120; font-size:18px;
    animation:revolotear 7s ease-in-out infinite;
  }
  @keyframes revolotear{
    0%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(40px,-22px) rotate(8deg); }
    50%{ transform:translate(10px,-44px) rotate(-6deg); }
    75%{ transform:translate(-30px,-18px) rotate(4deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }

  header{
    padding:calc(18px + env(safe-area-inset-top)) 20px 10px; text-align:center; position:relative; z-index:3;
    flex-shrink:0;
  }
  .titulo{
    font-family:Georgia, "Iowan Old Style", serif;
    font-size:22px; font-weight:600; letter-spacing:0.5px; color:var(--tinta);
    margin:0;
  }
  .contador{
    font-size:13px; color:var(--tinta); opacity:0.75; margin-top:2px;
  }

  /* Escena del jardín */
  .escena{
    flex:1; min-height:0; position:relative; z-index:2; overflow:hidden;
    background:linear-gradient(180deg, transparent 0%, transparent 62%, var(--tierra-clara) 62%, var(--tierra) 100%);
    transition:background 1.2s ease;
  }
  body.noche .escena{
    background:linear-gradient(180deg, transparent 0%, transparent 62%, #1A1130 62%, #0E0A1C 100%);
  }
  .pasto{
    position:absolute; bottom:0; left:0; right:0; height:38%; width:100%; z-index:1; display:block;
  }
  .brizna{
    position:absolute; bottom:0; width:3px; border-radius:3px 3px 0 0;
    background:var(--pasto-2); transform-origin:bottom center;
    animation:viento 2.6s ease-in-out infinite;
    z-index:90;
  }
  @keyframes viento{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }
  .flor{
    position:absolute; bottom:21%; transform-origin:bottom center;
    animation:crecer 900ms cubic-bezier(.34,1.56,.64,1) both;
    cursor:pointer;
  }
  .flor-especial{
    animation:crecer 900ms cubic-bezier(.34,1.56,.64,1) both, brillarDorado 2.4s ease-in-out infinite;
    filter:drop-shadow(0 0 10px rgba(242,193,78,0.65));
  }
  @keyframes brillarDorado{
    0%,100%{ filter:drop-shadow(0 0 8px rgba(242,193,78,0.55)); }
    50%{ filter:drop-shadow(0 0 18px rgba(255,214,107,0.85)); }
  }
  .destello{
    position:absolute; width:4px; height:4px; background:#FFE8A0; border-radius:50%;
    box-shadow:0 0 6px 2px rgba(255,230,160,0.9);
    animation:destellar 1.8s ease-in-out infinite;
  }
  @keyframes destellar{
    0%,100%{ opacity:0.2; transform:scale(0.6); }
    50%{ opacity:1; transform:scale(1.2); }
  }
  @keyframes crecer{
    from{ transform: translateY(10px) scale(0.2); opacity:0; }
    to{ transform: translateY(0) scale(var(--escala,1)); opacity:1; }
  }
  .sombra{
    position:absolute; bottom:-3px; left:50%; transform:translateX(-50%);
    width:34px; height:9px; border-radius:50%;
    background:rgba(0,0,0,0.28); filter:blur(1.5px);
  }
  .vacio{
    position:absolute; top:16%; left:50%; transform:translateX(-50%);
    text-align:center; font-size:14px; opacity:0.7;
    width:80%; line-height:1.5; z-index:50;
  }

  /* Ficha de flor al tocarla */
  .ficha{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px);
    background:var(--crema); color:var(--tinta); padding:14px 18px; border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:200; max-width:80%; text-align:center;
    opacity:0; transition:opacity 250ms ease, transform 250ms ease; pointer-events:none;
  }
  .ficha.activa{ opacity:1; transform:translateX(-50%) translateY(0); }
  .ficha .ficha-fecha{ font-weight:700; font-size:14px; }
  .ficha .ficha-nota{ font-size:13px; margin-top:4px; opacity:0.85; font-style:italic; }
  body.noche .ficha{ background:#2A2547; color:#F4F1FF; }

  /* Celebración de hitos */
  .hito{
    position:fixed; top:0; left:0; right:0; bottom:0; z-index:300;
    background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 350ms ease;
  }
  .hito.activo{ opacity:1; pointer-events:auto; }
  .hito-caja{
    background:var(--crema); color:var(--tinta); padding:28px 24px; border-radius:18px;
    text-align:center; max-width:84%; box-shadow:0 12px 36px rgba(0,0,0,0.3);
  }
  .hito-caja h2{ margin:0 0 8px; font-family:Georgia, serif; font-size:20px; }
  .hito-caja p{ margin:0 0 16px; font-size:14px; opacity:0.85; }
  .hito-caja button{
    border:none; background:var(--acento); color:#fff; padding:10px 22px;
    border-radius:12px; font-weight:700; font-size:14px;
  }

  /* Panel inferior: ingreso de código */
  .panel{
    position:relative; z-index:5; background:var(--crema);
    border-top:2px solid rgba(107,68,35,0.25);
    border-radius:22px 22px 0 0;
    padding:16px 20px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(59,42,26,0.18);
    flex-shrink:0;
  }
  .panel-label{
    font-size:12px; text-transform:uppercase; letter-spacing:1px;
    color:var(--tierra); opacity:0.8; margin-bottom:8px; font-weight:600;
  }
  .fila-codigo{ display:flex; gap:8px; }
  input#codigo{
    flex:1; border:2px solid var(--hoja-clara); border-radius:14px;
    padding:13px 14px; font-size:16px; background:#fff; color:var(--tinta);
    outline:none; letter-spacing:1px; font-weight:600; text-transform:uppercase;
  }
  input#codigo:focus{ border-color:var(--acento); }
  button#plantar{
    border:none; border-radius:14px; padding:0 20px; background:var(--acento);
    color:#fff; font-size:15px; font-weight:700; letter-spacing:0.3px;
  }
  button#plantar:active{ transform:scale(0.97); }
  .mensaje{
    margin-top:10px; font-size:13px; min-height:18px; font-weight:600;
  }
  .mensaje.ok{ color:var(--hoja); }
  .mensaje.error{ color:var(--acento); }

  .acciones-panel{ display:flex; gap:14px; margin-top:10px; }
  .acciones-panel button{
    background:none; border:none; font-size:11px; opacity:0.55; padding:4px 0;
    text-decoration:underline; color:var(--tinta);
  }
  body.noche .acciones-panel button{ color:#EDEAF6; }

  .reset{
    position:absolute; top:14px; left:14px; z-index:6; background:none;
    border:none; font-size:11px; color:var(--tinta); opacity:0.45; padding:6px;
  }
  /* ===== Clima real ===== */
  .gota{
    position:absolute; top:-5%; width:2px; border-radius:2px;
    background:rgba(200,220,255,0.55); z-index:95; pointer-events:none;
    animation:lluviaCaer linear infinite;
  }
  @keyframes lluviaCaer{
    from{ transform:translateY(0); opacity:0.8; }
    to{ transform:translateY(115vh); opacity:0.3; }
  }
  .niebla{
    position:absolute; left:0; right:0; bottom:0; height:60%;
    background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(230,235,240,0.55) 60%, rgba(230,235,240,0.7) 100%);
    z-index:96; pointer-events:none; opacity:0; transition:opacity 1.5s ease;
  }
  .niebla.activa{ opacity:1; }
  body.noche .niebla{ background:linear-gradient(180deg, rgba(20,20,35,0) 0%, rgba(40,40,60,0.5) 60%, rgba(40,40,60,0.65) 100%); }
  body.clima-nublado .sol, body.clima-nublado .luna{ opacity:0.35; }
  .clima-aviso{
    position:fixed; top:10px; right:12px; font-size:11px; opacity:0.5; z-index:7;
    background:rgba(0,0,0,0.08); padding:4px 8px; border-radius:8px;
  }
  body.noche .clima-aviso{ background:rgba(255,255,255,0.08); }
</style>
</head>
<body>

<div class="sol"></div>
<div class="luna"></div>
<div id="estrellas"></div>
<div id="nubes"></div>
<div id="particulas"></div>
<div id="bichos"></div>
<div id="lluvia"></div>
<div class="niebla" id="niebla"></div>
<div class="clima-aviso" id="climaAviso" style="display:none;"></div>
<button class="reset" id="btnReset" title="Reiniciar jardín (solo para pruebas)">reiniciar</button>

<header>
  <h1 class="titulo">Nuestro Jardín</h1>
  <div class="contador" id="contador">0 flores plantadas</div>
</header>

<div class="escena" id="escena">
  <div class="vacio" id="vacio">Aquí crecerá una flor<br>por cada vez que te lleve flores de verdad.</div>
  <svg class="pasto" id="pasto" viewBox="0 0 400 200" preserveAspectRatio="none">
    <path class="pasto-sup" d="M0,40 C60,10 120,55 200,30 C280,5 340,45 400,20 L400,200 L0,200 Z"/>
    <path class="pasto-inf" d="M0,70 C70,40 140,80 200,55 C270,30 330,75 400,50 L400,200 L0,200 Z"/>
  </svg>
</div>

<div class="ficha" id="ficha">
  <div class="ficha-fecha" id="fichaFecha"></div>
  <div class="ficha-nota" id="fichaNota"></div>
</div>

<div class="hito" id="hito">
  <div class="hito-caja">
    <h2 id="hitoTitulo">¡Jardín floreciente!</h2>
    <p id="hitoTexto"></p>
    <button id="hitoCerrar">Seguir cuidando el jardín</button>
  </div>
</div>

<div class="panel">
  <div class="panel-label">Código de flores</div>
  <div class="fila-codigo">
    <input id="codigo" type="text" placeholder="MANZANA-04821-7734" maxlength="80" autocapitalize="characters" autocomplete="off">
    <button id="plantar">Plantar</button>
  </div>
  <div class="mensaje" id="mensaje"></div>
  <div class="acciones-panel">
    <button id="btnExportar">Exportar progreso</button>
    <button id="btnImportar">Importar progreso</button>
  </div>
  <input type="file" id="archivoImportar" accept="application/json" style="display:none">
</div>

<script>
/* ===================== PALABRAS CLAVE =====================
   Cada palabra define cuántas flores se plantan con esa entrega.
   "especial:true" la marca como flor dorada de fecha importante.
   ============================================================= */
const PALABRAS_CLAVE = {
  "MANZANA":     { cantidad: 12 },
  "FLOR":        { cantidad: 10 },
  "ROSA":        { cantidad: 6  },
  "AMOR":        { cantidad: 20 },
  "LUNA":        { cantidad: 8  },
  "SOL":         { cantidad: 15 },
  "BESO":        { cantidad: 3  },
  "CORAZON":     { cantidad: 25 },
  "ANIVERSARIO": { cantidad: 1, especial: true }
};

/* ===================== CLAVE SECRETA =====================
   Debe ser EXACTAMENTE igual a la de generador.html.
   ============================================================= */
const CLAVE_SECRETA = "NuestroJardin-2026-Secreto";

function calcularFirma(palabra, numero, clave){
  const texto = palabra + "-" + numero + "-" + clave;
  let hash = 5381;
  for(let i=0; i<texto.length; i++){
    hash = ((hash * 33) ^ texto.charCodeAt(i)) >>> 0;
  }
  return String(hash % 9973).padStart(4, "0");
}
function b64DecodeUnicode(str){
  try{ return decodeURIComponent(escape(atob(str))); }catch(e){ return ""; }
}

const LS_KEY_USADOS = "jardin_codigos_usados_v1";
const LS_KEY_FLORES = "jardin_flores_v1";
const LS_KEY_HITOS   = "jardin_hitos_mostrados_v1";
const HITOS = [25, 50, 100, 200, 350, 500];

function cargarUsados(){ try{ return JSON.parse(localStorage.getItem(LS_KEY_USADOS)) || []; }catch(e){ return []; } }
function guardarUsados(arr){ localStorage.setItem(LS_KEY_USADOS, JSON.stringify(arr)); }
function cargarFlores(){ try{ return JSON.parse(localStorage.getItem(LS_KEY_FLORES)) || []; }catch(e){ return []; } }
function guardarFlores(arr){ localStorage.setItem(LS_KEY_FLORES, JSON.stringify(arr)); }
function cargarHitos(){ try{ return JSON.parse(localStorage.getItem(LS_KEY_HITOS)) || []; }catch(e){ return []; } }
function guardarHitos(arr){ localStorage.setItem(LS_KEY_HITOS, JSON.stringify(arr)); }

const PALETAS = [
  {petalo:"#E8536A", petalo2:"#D1495B", centro:"#F2C14E"},
  {petalo:"#F6C453", petalo2:"#E8A93A", centro:"#D1495B"},
  {petalo:"#F7B3C2", petalo2:"#F08FA6", centro:"#FFF6DC"},
  {petalo:"#D98CC0", petalo2:"#C16E9C", centro:"#FFE8C2"},
  {petalo:"#FFFFFF", petalo2:"#F1ECE0", centro:"#F2C14E"},
  {petalo:"#F0935A", petalo2:"#E8814A", centro:"#FFF6DC"},
  {petalo:"#9B7FD1", petalo2:"#8266BB", centro:"#FFE8C2"}
];
const PALETA_DORADA = {petalo:"#FFD66B", petalo2:"#F2A93A", centro:"#FFF6DC"};

let svgIdSeq = 0;

function svgMargarita(id, paleta, petalos, cy){
  let pet = "";
  for(let i=0; i<petalos; i++){
    const ang = (360/petalos)*i;
    pet += `<ellipse cx="0" cy="-15" rx="6.5" ry="14" fill="url(#g${id})" transform="rotate(${ang})"/>`;
  }
  return `<g transform="translate(30,${cy})">${pet}<circle cx="0" cy="0" r="7.5" fill="${paleta.centro}"/></g>`;
}
function svgTulipan(id, paleta, cy){
  return `<g transform="translate(30,${cy})">
    <path d="M0,-26 C-11,-22 -13,-6 0,4 C13,-6 11,-22 0,-26 Z" fill="url(#g${id})"/>
    <path d="M0,-22 C-6,-16 -7,-4 0,2 C7,-4 6,-16 0,-22 Z" fill="${paleta.petalo2}" opacity="0.55"/>
  </g>`;
}
function svgRedonda(id, paleta, cy){
  return `<g transform="translate(30,${cy})">
    <circle cx="0" cy="0" r="15" fill="url(#g${id})"/>
    <circle cx="0" cy="0" r="6.5" fill="${paleta.centro}"/>
  </g>`;
}
function svgDorada(id, paleta, cy){
  let pet = "";
  for(let i=0; i<10; i++){
    pet += `<ellipse cx="0" cy="-17" rx="6" ry="16" fill="url(#g${id})" transform="rotate(${36*i})"/>`;
  }
  return `<g transform="translate(30,${cy})">${pet}<circle cx="0" cy="0" r="9" fill="${paleta.centro}"/></g>`;
}

function svgFlor(paleta, tallo, tipo, especial){
  const id = svgIdSeq++;
  const grad = `<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${paleta.petalo}"/>
      <stop offset="100%" stop-color="${paleta.petalo2}"/>
    </linearGradient>`;

  // La cabeza siempre se ubica exactamente donde termina el tallo (punto superior),
  // sin importar qué tan largo sea: así nunca queda flotando ni separada.
  const cabezaY = Math.max(22, tallo*0.28);

  let cabeza;
  if(especial) cabeza = svgDorada(id, paleta, cabezaY);
  else if(tipo===0) cabeza = svgMargarita(id, paleta, 8, cabezaY);
  else if(tipo===1) cabeza = svgMargarita(id, paleta, 6, cabezaY);
  else if(tipo===2) cabeza = svgTulipan(id, paleta, cabezaY);
  else cabeza = svgRedonda(id, paleta, cabezaY);

  return `
  <svg width="60" height="${tallo}" viewBox="0 0 60 ${tallo}" style="display:block">
    <defs>${grad}</defs>
    <path d="M30,${tallo} C29,${tallo*0.62} 31,${cabezaY+18} 30,${cabezaY+2}"
      stroke="#3F6B33" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M30,${tallo*0.6} C20,${tallo*0.54} 15,${tallo*0.46} 24,${tallo*0.47}"
      stroke="#4F7942" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M30,${tallo*0.44} C40,${tallo*0.39} 45,${tallo*0.31} 36,${tallo*0.33}"
      stroke="#4F7942" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    ${cabeza}
  </svg>`;
}

function formatoFecha(ts){
  if(!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' });
}

function mostrarFicha(flor){
  const ficha = document.getElementById('ficha');
  document.getElementById('fichaFecha').textContent = flor.fecha ? ("Plantada el " + formatoFecha(flor.fecha)) : "Flor de tu jardín";
  document.getElementById('fichaNota').textContent = flor.nota || "";
  document.getElementById('fichaNota').style.display = flor.nota ? 'block' : 'none';
  ficha.classList.add('activa');
  clearTimeout(window._fichaTimeout);
  window._fichaTimeout = setTimeout(()=> ficha.classList.remove('activa'), 3200);
}

function pintarJardin(){
  const escena = document.getElementById('escena');
  const vacio = document.getElementById('vacio');
  const contador = document.getElementById('contador');
  const flores = cargarFlores();

  escena.querySelectorAll('.flor').forEach(f=>f.remove());
  vacio.style.display = flores.length === 0 ? 'block' : 'none';
  contador.textContent = flores.length + (flores.length === 1 ? ' flor plantada' : ' flores plantadas');

  aplicarTemporada(flores.length);

  const alturaEscena = escena.clientHeight || 300;
  const ordenadas = flores.map((f,i)=>({...f, idxOriginal:i})).sort((a,b)=>a.fila-b.fila);

  ordenadas.forEach((f)=>{
    const div = document.createElement('div');
    div.className = 'flor' + (f.especial ? ' flor-especial' : '');
    div.style.left = f.left + '%';
    const bottomPct = 14 + f.fila*12; // un poco más bajo para dejar margen arriba
    div.style.bottom = bottomPct + '%';

    // altura relativa al contenedor real (evita que el tallo se corte en pantallas chicas)
    const altoRel = (f.altoRel !== undefined) ? f.altoRel : 0.16 + Math.random()*0.05;
    const margenSuperior = 0.94; // deja un pequeño respiro arriba
    const espacioDisponible = alturaEscena * (margenSuperior - bottomPct/100);
    let altoPx = altoRel * alturaEscena;
    altoPx = Math.max(46, Math.min(altoPx, espacioDisponible));

    const escala = f.especial ? 1.55 : Math.min(f.escala || 1, 1.12);

    div.style.setProperty('--escala', escala);
    div.style.zIndex = 100 + Math.round(f.fila*900) + (f.especial?80:0);
    div.style.filter = `brightness(${0.86 + f.fila*0.16})`;
    div.innerHTML = `<div class="sombra" style="width:${28*escala}px"></div>` +
                     svgFlor(f.especial?PALETA_DORADA:PALETAS[f.paleta], altoPx, f.tipo, f.especial) +
                     (f.especial ? `
                       <div class="destello" style="top:6%; left:-6px; animation-delay:0s;"></div>
                       <div class="destello" style="top:18%; right:-8px; animation-delay:0.5s;"></div>
                       <div class="destello" style="top:0%; left:50%; animation-delay:1s;"></div>
                     ` : '');
    div.addEventListener('click', ()=> mostrarFicha(f));
    escena.appendChild(div);
  });

  actualizarBichos(flores.length);
}

/* ===================== TEMPORADAS ===================== */
function determinarTemporada(total){
  if(total < 30) return 'primavera';
  if(total < 80) return 'verano';
  if(total < 150) return 'otono';
  return 'invierno';
}
function aplicarTemporada(total){
  const temporada = determinarTemporada(total);
  ['primavera','verano','otono','invierno'].forEach(t=> document.body.classList.remove(t));
  document.body.classList.add(temporada);
  generarParticulas(temporada);
}
function generarParticulas(temporada){
  const cont = document.getElementById('particulas');
  cont.innerHTML = "";
  if(temporada === 'invierno'){
    for(let i=0; i<28; i++){
      const p = document.createElement('div');
      p.className = 'particula';
      const s = 3 + Math.random()*4;
      p.style.width = s+'px'; p.style.height = s+'px';
      p.style.background = 'rgba(255,255,255,0.85)';
      p.style.left = Math.random()*100 + '%';
      p.style.animationDuration = (6+Math.random()*6)+'s';
      p.style.animationDelay = (Math.random()*6)+'s';
      cont.appendChild(p);
    }
  } else if(temporada === 'otono'){
    for(let i=0; i<16; i++){
      const p = document.createElement('div');
      p.className = 'particula';
      p.style.width = '7px'; p.style.height = '7px'; p.style.borderRadius = '2px';
      p.style.background = (i%2===0)?'#C97A3D':'#D9A23E';
      p.style.left = Math.random()*100 + '%';
      p.style.animationDuration = (7+Math.random()*5)+'s';
      p.style.animationDelay = (Math.random()*6)+'s';
      cont.appendChild(p);
    }
  }
}

/* ===================== BICHOS (mariposas/abejas) ===================== */
function actualizarBichos(total){
  const cont = document.getElementById('bichos');
  cont.innerHTML = "";
  const n = total>=80 ? 3 : total>=40 ? 2 : total>=15 ? 1 : 0;
  for(let i=0; i<n; i++){
    const b = document.createElement('div');
    b.className = 'bicho';
    b.textContent = i%2===0 ? '🦋' : '🐝';
    b.style.left = (15 + Math.random()*70) + '%';
    b.style.top = (30 + Math.random()*30) + '%';
    b.style.animationDuration = (6+Math.random()*3)+'s';
    b.style.animationDelay = (Math.random()*2)+'s';
    cont.appendChild(b);
  }
}

/* ===================== HITOS ===================== */
function revisarHito(totalAntes, totalAhora){
  const mostrados = cargarHitos();
  for(const h of HITOS){
    if(totalAntes < h && totalAhora >= h && !mostrados.includes(h)){
      mostrados.push(h);
      guardarHitos(mostrados);
      mostrarHito(h);
      return;
    }
  }
}
function mostrarHito(h){
  document.getElementById('hitoTexto').textContent = `Tu jardín alcanzó ${h} flores. Cada una es una vez que pensaste en ella.`;
  document.getElementById('hito').classList.add('activo');
}
document.getElementById('hitoCerrar').addEventListener('click', ()=>{
  document.getElementById('hito').classList.remove('activo');
});

function plantarFlor(){
  const input = document.getElementById('codigo');
  const mensaje = document.getElementById('mensaje');
  const codigoOriginal = input.value.trim();
  const codigoUpper = codigoOriginal.toUpperCase();

  if(!codigoUpper){
    mensaje.textContent = "Escribe un código primero.";
    mensaje.className = "mensaje error";
    return;
  }

  // Formato: PALABRA-NUMERO-FIRMA  o  PALABRA-NUMERO-FIRMA-PAYLOAD(base64)
  const partes = codigoOriginal.split("-");
  if(partes.length < 3 || !/^[0-9]+$/.test(partes[1]) || !/^[0-9]{1,4}$/.test(partes[2])){
    mensaje.textContent = "Código incompleto o con formato incorrecto.";
    mensaje.className = "mensaje error";
    return;
  }
  const palabra = partes[0].toUpperCase();
  const numero = partes[1];
  const firma = partes[2];
  const payloadB64 = partes.length >= 4 ? partes.slice(3).join("-") : null;

  const info = PALABRAS_CLAVE[palabra];
  if(!info){
    mensaje.textContent = "Esa palabra no es válida.";
    mensaje.className = "mensaje error";
    return;
  }

  const firmaEsperada = calcularFirma(palabra, numero, CLAVE_SECRETA);
  if(firma.padStart(4,"0") !== firmaEsperada){
    mensaje.textContent = "Código no autorizado.";
    mensaje.className = "mensaje error";
    return;
  }

  const claveUso = palabra + "-" + numero + "-" + firma;
  const usados = cargarUsados();
  if(usados.includes(claveUso)){
    mensaje.textContent = "Ese código ya fue usado. ¡Esas flores ya están en el jardín!";
    mensaje.className = "mensaje error";
    return;
  }

  usados.push(claveUso);
  guardarUsados(usados);

  // Decodifica nota y/o fecha personalizada. Compatible con códigos viejos
  // que solo traían texto plano de nota (sin fecha).
  let nota = "";
  let fechaPersonalizada = null;
  if(payloadB64){
    const decodificado = b64DecodeUnicode(payloadB64);
    try{
      const obj = JSON.parse(decodificado);
      nota = obj.nota || "";
      if(obj.fecha){
        const ts = Date.parse(obj.fecha + "T12:00:00");
        if(!isNaN(ts)) fechaPersonalizada = ts;
      }
    }catch(e){
      nota = decodificado; // formato viejo: texto plano
    }
  }

  const flores = cargarFlores();
  const totalAntes = flores.length;
  const cantidad = info.cantidad;

  for(let i=0; i<cantidad; i++){
    const fila = Math.random();
    flores.push({
      left: 2 + Math.random()*96,
      altoRel: 0.16 + Math.random()*0.05,
      paleta: Math.floor(Math.random()*PALETAS.length),
      tipo: Math.floor(Math.random()*4),
      fila: fila,
      escala: 0.92 + fila*0.18,
      especial: !!info.especial,
      fecha: fechaPersonalizada || Date.now(),
      nota: nota
    });
  }
  guardarFlores(flores);
  pintarJardin();
  revisarHito(totalAntes, flores.length);

  input.value = "";
  mensaje.textContent = `¡${cantidad} flor${cantidad>1?'es':''} nueva${cantidad>1?'s':''} en tu jardín! 🌸`;
  mensaje.className = "mensaje ok";
}

/* ===================== DÍA / NOCHE ===================== */
function generarEstrellas(){
  const cont = document.getElementById('estrellas');
  if(cont.childElementCount > 0) return;
  for(let i=0; i<40; i++){
    const e = document.createElement('div');
    e.className = 'estrella';
    e.style.left = Math.random()*100 + '%';
    e.style.top = Math.random()*42 + '%';
    e.style.animationDelay = (Math.random()*3) + 's';
    cont.appendChild(e);
  }
}
function lanzarFugaz(){
  if(!document.body.classList.contains('noche')) return;
  const cont = document.getElementById('estrellas');
  const f = document.createElement('div');
  f.className = 'fugaz';
  f.style.left = (40 + Math.random()*40) + '%';
  f.style.top = (8 + Math.random()*18) + '%';
  cont.appendChild(f);
  setTimeout(()=> f.remove(), 1300);
}
function generarNubes(){
  const cont = document.getElementById('nubes');
  cont.innerHTML = "";
  const formas = [
    `<svg viewBox="0 0 120 50"><ellipse cx="30" cy="32" rx="28" ry="16" fill="#fff"/><ellipse cx="62" cy="22" rx="32" ry="20" fill="#fff"/><ellipse cx="95" cy="34" rx="24" ry="14" fill="#fff"/></svg>`,
    `<svg viewBox="0 0 120 50"><ellipse cx="25" cy="30" rx="22" ry="14" fill="#fff"/><ellipse cx="55" cy="20" rx="28" ry="18" fill="#fff"/><ellipse cx="85" cy="30" rx="22" ry="13" fill="#fff"/></svg>`
  ];
  for(let i=0; i<4; i++){
    const n = document.createElement('div');
    n.className = 'nube';
    const ancho = 90 + Math.random()*70;
    n.style.width = ancho+'px'; n.style.height = (ancho*0.42)+'px';
    n.style.top = (4 + Math.random()*14) + '%';
    n.style.animationDuration = (50 + Math.random()*40) + 's';
    n.style.animationDelay = (-Math.random()*60) + 's';
    n.innerHTML = formas[i % formas.length];
    cont.appendChild(n);
  }
}
function generarBriznas(){
  const escena = document.getElementById('escena');
  escena.querySelectorAll('.brizna').forEach(b=>b.remove());
  for(let i=0; i<26; i++){
    const b = document.createElement('div');
    b.className = 'brizna';
    const alto = 14 + Math.random()*14;
    b.style.height = alto+'px';
    b.style.left = (Math.random()*100) + '%';
    b.style.bottom = '0%';
    b.style.animationDuration = (2 + Math.random()*1.4) + 's';
    b.style.animationDelay = (Math.random()*2) + 's';
    escena.insertBefore(b, escena.firstChild.nextSibling);
  }
}
function actualizarCicloDia(){
  const hora = new Date().getHours();
  const esNoche = (hora >= 19 || hora < 6);
  document.body.classList.toggle('noche', esNoche);
}
generarEstrellas();
generarNubes();
generarBriznas();
actualizarCicloDia();
setInterval(actualizarCicloDia, 60000);
setInterval(lanzarFugaz, 9000);

/* ===================== CLIMA REAL ===================== */
const LS_KEY_CLIMA = "jardin_clima_cache_v1";
const CLIMA_VALIDEZ_MS = 20 * 60 * 1000; // 20 minutos

function interpretarCodigoClima(codigo){
  if(codigo === 0) return 'despejado';
  if(codigo >= 1 && codigo <= 3) return 'nublado';
  if(codigo === 45 || codigo === 48) return 'niebla';
  if((codigo >= 51 && codigo <= 67) || (codigo >= 80 && codigo <= 82)) return 'lluvia';
  if(codigo >= 71 && codigo <= 77) return 'nieve';
  if(codigo >= 95) return 'tormenta';
  return 'despejado';
}

function generarLluvia(activar){
  const cont = document.getElementById('lluvia');
  cont.innerHTML = "";
  if(!activar) return;
  for(let i=0; i<40; i++){
    const g = document.createElement('div');
    g.className = 'gota';
    g.style.left = Math.random()*100 + '%';
    g.style.height = (10 + Math.random()*10) + 'px';
    g.style.animationDuration = (0.5 + Math.random()*0.4) + 's';
    g.style.animationDelay = (Math.random()*1) + 's';
    cont.appendChild(g);
  }
}

function aplicarClimaReal(condicion, nombreZona){
  const clasesClima = ['clima-despejado','clima-nublado','clima-niebla','clima-lluvia','clima-nieve','clima-tormenta','clima-sin-permiso'];
  clasesClima.forEach(c => document.body.classList.remove(c));
  document.body.classList.add('clima-' + condicion);

  generarLluvia(condicion === 'lluvia' || condicion === 'tormenta');
  document.getElementById('niebla').classList.toggle('activa', condicion === 'niebla');
  if(condicion === 'nieve'){
    generarParticulas('invierno');
  }
  const aviso = document.getElementById('climaAviso');
  const etiquetas = {
    despejado:'Despejado', nublado:'Nublado', niebla:'Con niebla',
    lluvia:'Lluvia', nieve:'Nevando', tormenta:'Tormenta'
  };
  aviso.textContent = (nombreZona ? nombreZona + ' · ' : '') + (etiquetas[condicion] || '');
  aviso.style.display = 'block';
}

function aplicarCieloSinPermiso(){
  const clasesClima = ['clima-despejado','clima-nublado','clima-niebla','clima-lluvia','clima-nieve','clima-tormenta'];
  clasesClima.forEach(c => document.body.classList.remove(c));
  document.body.classList.add('clima-sin-permiso');
  generarLluvia(false);
  document.getElementById('niebla').classList.remove('activa');
  document.getElementById('climaAviso').style.display = 'none';
}

function consultarClimaReal(lat, lon){
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
    .then(r => r.json())
    .then(datos => {
      if(!datos.current_weather) return;
      const condicion = interpretarCodigoClima(datos.current_weather.weathercode);
      const cache = { condicion, lat, lon, ts: Date.now() };
      localStorage.setItem(LS_KEY_CLIMA, JSON.stringify(cache));
      aplicarClimaReal(condicion, null);
    })
    .catch(()=>{ aplicarCieloSinPermiso(); });
}

function iniciarClimaReal(){
  try{
    const cacheRaw = localStorage.getItem(LS_KEY_CLIMA);
    if(cacheRaw){
      const cache = JSON.parse(cacheRaw);
      if(Date.now() - cache.ts < CLIMA_VALIDEZ_MS){
        aplicarClimaReal(cache.condicion, null);
        return;
      }
    }
  }catch(e){}

  if(!navigator.geolocation){
    aplicarCieloSinPermiso();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => consultarClimaReal(pos.coords.latitude, pos.coords.longitude),
    () => aplicarCieloSinPermiso(),
    { timeout: 8000, maximumAge: CLIMA_VALIDEZ_MS }
  );
}
iniciarClimaReal();
setInterval(iniciarClimaReal, CLIMA_VALIDEZ_MS);

/* ===================== EXPORTAR / IMPORTAR ===================== */
document.getElementById('btnExportar').addEventListener('click', ()=>{
  const datos = {
    usados: cargarUsados(),
    flores: cargarFlores(),
    hitos: cargarHitos(),
    exportado: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(datos)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'jardin_respaldo.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});
document.getElementById('btnImportar').addEventListener('click', ()=>{
  document.getElementById('archivoImportar').click();
});
document.getElementById('archivoImportar').addEventListener('change', (e)=>{
  const archivo = e.target.files[0];
  if(!archivo) return;
  const lector = new FileReader();
  lector.onload = ()=>{
    try{
      const datos = JSON.parse(lector.result);
      if(Array.isArray(datos.usados)) guardarUsados(datos.usados);
      if(Array.isArray(datos.flores)) guardarFlores(datos.flores);
      if(Array.isArray(datos.hitos)) guardarHitos(datos.hitos);
      pintarJardin();
      const mensaje = document.getElementById('mensaje');
      mensaje.textContent = "Progreso importado correctamente.";
      mensaje.className = "mensaje ok";
    }catch(err){
      alert("El archivo no es un respaldo válido del jardín.");
    }
  };
  lector.readAsText(archivo);
  e.target.value = "";
});

document.getElementById('plantar').addEventListener('click', plantarFlor);
document.getElementById('codigo').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') plantarFlor();
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(confirm("¿Borrar todo el progreso del jardín? Esto es solo para pruebas.")){
    localStorage.removeItem(LS_KEY_USADOS);
    localStorage.removeItem(LS_KEY_FLORES);
    localStorage.removeItem(LS_KEY_HITOS);
    pintarJardin();
  }
});

pintarJardin();

/* Reajusta el jardín cuando cambia el alto visible real (barra de Safari
   aparece/desaparece, o se gira el teléfono), para que las flores siempre
   se calculen con el tamaño correcto y no se corten ni se vean mal. */
let _resizeTimeout;
window.addEventListener('resize', ()=>{
  clearTimeout(_resizeTimeout);
  _resizeTimeout = setTimeout(pintarJardin, 200);
});
window.addEventListener('orientationchange', ()=>{
  setTimeout(pintarJardin, 300);
});
</script>
